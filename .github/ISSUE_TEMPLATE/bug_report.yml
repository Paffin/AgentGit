name: Bug report
description: Something behaves differently from what the docs promise
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! **Security problems:** do not file them here, see SECURITY.md.
  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `ag --version` (or the commit hash)
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: The exact commands. A script based on `examples/quickstart.sh` is ideal.
      render: shell
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics
      description: If an integration was involved, paste `ag --json op show <operation id>`; always useful, `ag verify`.
      render: shell
  - type: input
    id: os
    attributes:
      label: OS / filesystem
      description: e.g. Ubuntu 24.04 ext4, macOS 15 APFS (case-insensitive)
