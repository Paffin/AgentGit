name: Feature request
description: Propose an improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do that is hard or impossible today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
  - type: textarea
    id: guarantees
    attributes:
      label: Which guarantees does this touch?
      description: Hashing, formats, merge semantics, publication/integration, policy, security. These need an ADR.
