version: 2

# Every ecosystem the repository has a lock file or manifest for, so that a dependency we ship or build with does
# not age silently. The pull requests are what the Security workflow (security.yml) and the CI workflows then judge;
# a green run is the evidence that the update is safe, a maintainer does the merge. Groups keep the number of
# pull requests down: minor and patch updates of one ecosystem arrive together, major updates one by one. Each pull
# request runs every workflow whose paths it touches, so the open-pull-requests limits are deliberately low: the
# first run over a long-neglected repository opened eighteen at once and queued about a hundred workflow runs.
# Policy: docs/operations/supply-chain.md.

updates:
  # --- Rust -------------------------------------------------------------------------------------------------------
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      rust-minor-and-patch:
        update-types: [minor, patch]
  # The fuzz harness is a workspace of its own with its own Cargo.lock (libfuzzer-sys, arbitrary).
  - package-ecosystem: cargo
    directory: /fuzz
    schedule:
      interval: weekly
    open-pull-requests-limit: 1
    groups:
      fuzz-minor-and-patch:
        update-types: [minor, patch]

  # --- JavaScript / TypeScript --------------------------------------------------------------------------------------
  - package-ecosystem: npm
    directory: /apps/web
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    ignore:
      # typescript 7 conflicts with the peer ranges of openapi-typescript (typescript ^5.x) and the lint/type toolchain
      # (npm ci fails with ERESOLVE, PR #18/#19). Move it when those accept 7.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      # The runtime and the CI image are Node 22 (engines >=22.18); the types follow the runtime, not the newest Node.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      web-minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /sdk/typescript
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    ignore:
      # typescript 7 conflicts with the peer ranges of openapi-typescript (typescript ^5.x) and the lint/type toolchain
      # (npm ci fails with ERESOLVE, PR #18/#19). Move it when those accept 7.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      # The runtime and the CI image are Node 22 (engines >=22.18); the types follow the runtime, not the newest Node.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      ts-sdk-minor-and-patch:
        update-types: [minor, patch]

  # --- Python -------------------------------------------------------------------------------------------------------
  # The SDK is locked by uv (sdk/python/uv.lock).
  - package-ecosystem: uv
    directory: /sdk/python
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    groups:
      python-sdk-minor-and-patch:
        update-types: [minor, patch]
  # docs/requirements.txt (MkDocs and its plugins) is hash-locked by `uv pip compile` and is refreshed by hand with
  # the command in docs/requirements.in: a Dependabot `pip` update would rewrite versions without their hashes.

  # --- Go -----------------------------------------------------------------------------------------------------------
  - package-ecosystem: gomod
    directory: /services/agent-orchestrator
    schedule:
      interval: weekly
    open-pull-requests-limit: 2

  # --- Containers ---------------------------------------------------------------------------------------------------
  # Base images of the shipped containers (deploy/docker/Dockerfile, services/agent-orchestrator/Dockerfile) and the
  # Compose stack's service images. A Rust or Go image bump moves the toolchain the release images are built with;
  # the Containers workflow tests it, and the Security workflow's govulncheck scans with the Go of the Dockerfile.
  - package-ecosystem: docker
    directory: /deploy/docker
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /services/agent-orchestrator
    schedule:
      interval: weekly
  - package-ecosystem: docker-compose
    directory: /deploy/compose
    schedule:
      interval: weekly
    ignore:
      # The PostgreSQL suites run on 16 only (docs/operations/postgres-and-s3.md "honest limits") and a major image
      # bump cannot reuse an existing data volume (the 18 images keep data under /var/lib/postgresql/<major>/, so the
      # volume needs pg_upgrade or a dump and restore). Moved by hand with a migration note, not by a bot.
      - dependency-name: postgres
        update-types: ["version-update:semver-major"]

  # --- CI -----------------------------------------------------------------------------------------------------------
  # Every action is pinned to a commit SHA with its release in a comment (scripts/check_workflows.py); Dependabot
  # updates both.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions-minor-and-patch:
        update-types: [minor, patch]
