name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Ubuntu 24.04 runners restrict unprivileged user namespaces with AppArmor, which is what the namespace
      # sandbox (`ag-sandbox`) needs. Lift that, and make the sandbox suites *fail* instead of skipping if the
      # runner still cannot run them: a green run must mean the isolation was actually exercised.
      - name: Allow unprivileged user namespaces
        if: runner.os == 'Linux'
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      - name: Build
        run: cargo build --workspace --all-targets
      - name: Test
        run: cargo test --workspace
        env:
          AG_REQUIRE_SANDBOX: ${{ runner.os == 'Linux' && '1' || '' }}
          # The tutorials' commands run against this build of `ag` (crates/ag-cli/tests/docs_snippets.rs); a missing
          # bash, python3 or git fails the test instead of skipping it.
          AG_REQUIRE_DOC_SNIPPETS: "1"

  lint:
    name: fmt + clippy + rustdoc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  msrv:
    name: MSRV (1.89)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Select the toolchain with the `toolchain` input rather than an `@1.89.0` ref:
      # Dependabot would "update" such a ref and silently move the MSRV.
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.89.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --all-targets

  docs-and-demo:
    name: generated docs + demo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build release binary
        run: cargo build --release -p ag-cli
      - name: CLI reference is up to date
        run: AG=target/release/ag python3 scripts/gen_cli_docs.py --check
      - name: README artwork is up to date
        run: python3 scripts/gen_readme_assets.py --check
      - name: README demo still behaves as documented
        run: AG=$PWD/target/release/ag ./examples/quickstart.sh
      # Links, test names, `ag` commands, environment variables and the refusal messages quoted in the docs are checked
      # against the code. --require-ag: a missing binary fails the step instead of skipping the command check.
      - name: Docs match the code
        run: AG=$PWD/target/release/ag python3 scripts/check_docs.py --require-ag
      # No todo!(), TODO/FIXME/XXX/HACK, "for now", placeholder, stub, mock/fake/dummy or simulation in product source
      # (tests excluded); the exceptions, each with a reason, are in scripts/no_stubs_allowlist.txt.
      - name: No stubs or simulated code in product source
        run: |
          python3 scripts/test_check_no_stubs.py
          python3 scripts/check_no_stubs.py

  backends:
    name: PostgreSQL + S3 backends
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # scripts/pg-test.sh finds the server binaries under /usr/lib/postgresql/*/bin
      # (PostgreSQL ships on the runner image); scripts/s3-test.sh installs moto into a venv, or downloads the pinned
      # SeaweedFS release (SHA-256 checked).
      - name: Make sure the PostgreSQL server binaries are present
        run: ls /usr/lib/postgresql/*/bin/initdb || sudo apt-get install -y --no-install-recommends postgresql
      # Every suite on PostgreSQL metadata and S3 objects; a missing server fails the run
      # instead of silently falling back to SQLite and files. The S3 server here is moto, a Python
      # re-implementation of the API that recomputes every request's SigV4 signature.
      - name: Test on PostgreSQL + S3 (moto)
        run: AG_REQUIRE_BACKENDS=1 scripts/pg-test.sh scripts/s3-test.sh cargo test --workspace
      # The same object-store suites against a real S3 server: SeaweedFS, the one the Compose stack runs, with a
      # configured identity so that the gateway verifies every signature (the script refuses to run otherwise).
      # Everything that moves its objects to S3 when AG_TEST_S3_ENDPOINT is set: the store's own suite
      # (crates/ag-storage/tests/s3.rs), the engine's lifecycle/GC suites and the server's backend suite.
      - name: Test on PostgreSQL + S3 (SeaweedFS, a real S3 server)
        run: |
          AG_REQUIRE_BACKENDS=1 AG_S3_SERVER=seaweedfs scripts/pg-test.sh scripts/s3-test.sh \
            bash -c 'cargo test -p ag-storage -p ag-integrate && cargo test -p ag-server --test storage_backends'

  deploy:
    name: deployment files
    runs-on: ubuntu-latest
    env:
      KUSTOMIZE_VERSION: v5.6.0
      KUBECONFORM_VERSION: v0.6.7
      PROMETHEUS_VERSION: 3.2.1
    steps:
      - uses: actions/checkout@v7
      - name: Install kustomize, kubeconform, promtool
        run: |
          set -euo pipefail
          mkdir -p "$HOME/bin"
          curl -sSL "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2F${KUSTOMIZE_VERSION}/kustomize_${KUSTOMIZE_VERSION}_linux_amd64.tar.gz" | tar xz -C "$HOME/bin" kustomize
          curl -sSL "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" | tar xz -C "$HOME/bin" kubeconform
          curl -sSL "https://github.com/prometheus/prometheus/releases/download/v${PROMETHEUS_VERSION}/prometheus-${PROMETHEUS_VERSION}.linux-amd64.tar.gz" | tar xz -C "$HOME/bin" --strip-components=1 "prometheus-${PROMETHEUS_VERSION}.linux-amd64/promtool"
          echo "$HOME/bin" >> "$GITHUB_PATH"
      - run: pip install pyyaml
      - name: Manifests, alert rules, Compose file and dashboards
        run: python3 scripts/check_deploy.py --strict
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Shipped server configurations load with this server
        run: cargo test -p ag-server --test deploy_configs

  # The container images (both targets, health check, hardened run, end-to-end smoke, compose, kubernetes) are built
  # and proven by containers.yml, which runs on every push and pull request that can change an image. They used to
  # be built a second time here, with another cache scope and a weaker check.

  sdk:
    name: client SDKs (TypeScript, Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -p ag-server -p ag-cli
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: sdk/typescript/package-lock.json
      - name: TypeScript SDK (generate:check, types, lint, tests against the real server, package)
        working-directory: sdk/typescript
        run: npm ci && AG_SERVER_BIN=$GITHUB_WORKSPACE/target/debug/ag-server npm run check
      - uses: astral-sh/setup-uv@v5
      - name: Python SDK (tests against the real server, ruff, mypy, generated code)
        working-directory: sdk/python
        run: |
          uv sync
          AG_SERVER_BIN=$GITHUB_WORKSPACE/target/debug/ag-server uv run pytest
          uv run ruff check .
          uv run ruff format --check .
          uv run mypy
          uv run python scripts/generate.py --check
      - name: Code samples in the docs are the code that is tested
        run: python3 sdk/tools/sync_doc_samples.py --check

  orchestrator:
    name: agent orchestrator (Go)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -p ag-server
      - uses: actions/setup-go@v5
        with:
          go-version-file: services/agent-orchestrator/go.mod
          cache-dependency-path: services/agent-orchestrator/go.sum
      - name: vet, format, race tests (the integration suite runs a real ag-server)
        working-directory: services/agent-orchestrator
        run: |
          go vet ./...
          test -z "$(gofmt -l .)"
          AG_SERVER_BIN=$GITHUB_WORKSPACE/target/debug/ag-server go test -race ./...

  # The completion scripts must parse in the shells they are for. A missing shell fails the run (AG_REQUIRE_SHELLS)
  # instead of being skipped; PowerShell is on the runner image, zsh and fish are installed here.
  shells:
    name: shell completions (bash, zsh, fish, PowerShell)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install zsh and fish
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends zsh fish
      - name: The scripts parse; bash completes real commands; the shipped copies are current
        run: AG_REQUIRE_SHELLS=1 cargo test -p ag-cli --test completions
