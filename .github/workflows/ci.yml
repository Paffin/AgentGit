name: CI

# Fast, path-aware feedback for continuous work. Qualification owns the full matrix.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"

jobs:
  superseded:
    name: release stale runner capacity
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    continue-on-error: true
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Cancel old validation and candidate builds (never Release)
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/cancel_stale_ci.py

  changes:
    timeout-minutes: 3
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-24.04
    outputs:
      rust: ${{ steps.paths.outputs.rust }}
      sdk: ${{ steps.paths.outputs.sdk }}
      go: ${{ steps.paths.outputs.go }}
      tooling: ${{ steps.paths.outputs.tooling }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: paths
        env:
          GH_TOKEN: ${{ github.token }}
          CI_WORKFLOW: ci.yml
        run: python3 scripts/ci_changes.py

  tooling:
    timeout-minutes: 5
    name: workflow and release contracts
    needs: changes
    if: needs.changes.outputs.tooling == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 -m pip install --disable-pip-version-check PyYAML
      - name: Offline pipeline and release safety tests
        run: |
          set -e
          python3 scripts/check_workflows.py --strict
          python3 scripts/security_exceptions.py check
          python3 scripts/check_dependabot.py
          python3 scripts/check_deploy.py
          python3 scripts/check_no_stubs.py
          for test in test_ci_policy test_release_candidate test_request_release test_release_scripts test_check_workflows test_web_e2e_workflow test_check_dependabot test_py39_compat; do
            python3 "scripts/$test.py"
          done

  rust:
    name: Linux unit and storage contracts
    needs: changes
    if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.sdk == 'true' || needs.changes.outputs.go == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      AG_SKIP_REPORT: /tmp/fast-rust-skips.jsonl
      AG_REQUIRE_COMPONENTS: namespace-sandbox
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: linux-debug
          cache-workspace-crates: true
          cache-on-failure: true
      - name: Formatting and code lint
        if: needs.changes.outputs.rust == 'true'
        run: cargo fmt --all --check && cargo clippy --workspace --lib --bins --locked -- -D warnings
      - name: Enable unprivileged namespace tests
        if: needs.changes.outputs.rust == 'true'
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Unit tests and core storage contracts
        if: needs.changes.outputs.rust == 'true'
        run: |
          cargo test --workspace --lib --bins --locked
          cargo test -p agentgit-integrate -p agentgit-storage --test '*' --locked
          cargo test -p agentgit-server --test audit_regressions --test review_scope --test workspace_creation --locked
      - name: Check unexpected skips
        if: ${{ !cancelled() && needs.changes.outputs.rust == 'true' }}
        run: python3 scripts/check_skips.py --job ci/test-fast --report /tmp/fast-rust-skips.jsonl
      - name: Build shared test tools once
        if: needs.changes.outputs.sdk == 'true' || needs.changes.outputs.go == 'true'
        run: |
          cargo build -p agentgit-server -p agentgit-cli --locked
          cd target/debug
          sha256sum ag ag-server > binaries.sha256
          tar -czf ci-tools.tar.gz ag ag-server binaries.sha256
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: needs.changes.outputs.sdk == 'true' || needs.changes.outputs.go == 'true'
        with:
          name: ci-tools
          path: target/debug/ci-tools.tar.gz
          compression-level: 0
          retention-days: 1

  sdk:
    name: SDK contracts on one supported runtime
    needs: [changes, rust]
    if: needs.changes.outputs.sdk == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      AG_SERVER_BIN: ${{ github.workspace }}/target/debug/ag-server
      RUST_LOG: error
      AG_SKIP_REPORT: /tmp/fast-sdk-skips.jsonl
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ci-tools
          path: target/debug
      - name: Restore checked binaries
        working-directory: target/debug
        run: tar -xzf ci-tools.tar.gz && sha256sum --check binaries.sha256
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: sdk/typescript/package-lock.json
      - name: TypeScript SDK
        working-directory: sdk/typescript
        run: npm ci && npm run check
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Python SDK
        working-directory: sdk/python
        run: |
          uv sync --locked
          uv run pytest
          uv run ruff check .
          uv run ruff format --check .
          uv run mypy
          uv run python scripts/generate.py --check
      - run: python3 sdk/tools/sync_doc_samples.py --check
      - run: python3 scripts/check_skips.py --job ci/sdk --report /tmp/fast-sdk-skips.jsonl

  go:
    name: Go executor contracts
    needs: [changes, rust]
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      AG_SERVER_BIN: ${{ github.workspace }}/target/debug/ag-server
      AG_REQUIRE_COMPONENTS: ag-server-binary
      AG_SKIP_REPORT: /tmp/fast-go-skips.jsonl
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ci-tools
          path: target/debug
      - name: Restore checked binaries
        working-directory: target/debug
        run: tar -xzf ci-tools.tar.gz && sha256sum --check binaries.sha256
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: services/agent-orchestrator/go.mod
          cache-dependency-path: services/agent-orchestrator/go.sum
      - name: Format, vet and race tests
        working-directory: services/agent-orchestrator
        run: |
          test -z "$(gofmt -l .)"
          go vet ./...
          go test -race ./...
      - run: python3 scripts/check_skips.py --job ci/orchestrator --report /tmp/fast-go-skips.jsonl

  complete:
    timeout-minutes: 2
    name: CI
    if: always()
    needs: [changes, tooling, rust, sdk, go]
    runs-on: ubuntu-24.04
    steps:
      - name: Reject failed or cancelled required jobs
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PYTHON'
          import json, os
          results = json.loads(os.environ['RESULTS'])
          bad = [name for name, job in results.items() if job['result'] not in ('success', 'skipped')]
          if results['changes']['result'] != 'success' or bad:
              raise SystemExit('CI failed: ' + ', '.join(bad))
          PYTHON
