name: OCI runtimes and cgroup v2

# The OCI sandbox is only worth anything if a real container runtime accepts its flags and the kernel enforces
# what they request; the namespace sandbox's memory and task limits are only exact on a real, delegated cgroup v2
# hierarchy. Neither can be shown with a fake runtime or a fake directory, so these jobs run the real thing:
#
#   * docker, rootful podman and rootless podman, each against a small image pinned by digest and pulled here
#     (the sandbox never pulls), asserting from *inside* the container: no network, read-only root, no new
#     privileges, no capabilities, memory / pids / CPU limits, no view of the worker's keys, cleanup.
#   * the whole `ag-sandbox` suite on a delegated cgroup v2 subtree prepared as root and used by the test user,
#     including crates/ag-sandbox/tests/cgroup_real.rs (memory.max, pids.max, memory.peak, OOM kills, removal).
#
# AG_REQUIRE_COMPONENTS (oci:docker / oci:podman, cgroup-v2, namespace-sandbox) turns every skip of what the job
# claims to run into a failure: a runner that cannot do it must not go green. Whatever still skips is listed, and
# fails the job unless tests/skip-allowlist.toml has reviewed it (scripts/check_skips.py).

on:
  push:
    branches: [main]
    paths:
      - "crates/ag-sandbox/**"
      - "crates/ag-worker/**"
      - "crates/ag-client/**"
      - ".github/workflows/oci-runtimes.yml"
      - "Cargo.lock"
  pull_request:
    paths:
      - "crates/ag-sandbox/**"
      - "crates/ag-worker/**"
      - "crates/ag-client/**"
      - ".github/workflows/oci-runtimes.yml"
      - "Cargo.lock"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: oci-runtimes-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  # BusyBox 1.36.1 (multi-architecture index), pinned by digest like every image the sandbox accepts.
  OCI_TEST_IMAGE: docker.io/library/busybox@sha256:73aaf090f3d85aa34ee199857f03fa3a95c8ede2ffd4cc2cdb5b94e566b11662

jobs:
  runtimes:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: docker
            leg: docker
            component: "oci:docker"
          - name: podman (rootful)
            leg: podman-rootful
            component: "oci:podman"
          - name: podman (rootless)
            leg: podman-rootless
            component: "oci:podman"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: The host
        run: |
          uname -r
          stat -fc 'cgroup file system: %T' /sys/fs/cgroup
          cat /sys/fs/cgroup/cgroup.controllers
          id
          cat /proc/self/cgroup
          docker version --format 'docker {{.Server.Version}}' || true
          podman --version || true
      - name: Docker
        if: matrix.leg == 'docker'
        run: |
          docker pull "$OCI_TEST_IMAGE"
          docker info --format '{{json .SecurityOptions}} cgroup v{{.CgroupVersion}} driver {{.CgroupDriver}}'
          echo "AG_OCI_RUNTIME=docker" >> "$GITHUB_ENV"
      - name: Podman, rootful (through sudo)
        if: matrix.leg == 'podman-rootful'
        run: |
          command -v podman || { sudo apt-get update -qq && sudo apt-get install -y podman; }
          sudo podman --version
          printf '#!/bin/sh\nexec sudo -n podman "$@"\n' | sudo tee /usr/local/bin/podman-rootful > /dev/null
          sudo chmod 0755 /usr/local/bin/podman-rootful
          sudo podman pull "$OCI_TEST_IMAGE"
          sudo podman info --format '{{json .Host.Security}} cgroups={{.Host.CgroupsVersion}} manager={{.Host.CgroupManager}}'
          echo "AG_OCI_RUNTIME=/usr/local/bin/podman-rootful" >> "$GITHUB_ENV"
      - name: Podman, rootless
        if: matrix.leg == 'podman-rootless'
        run: |
          command -v podman || { sudo apt-get update -qq && sudo apt-get install -y podman; }
          podman --version
          grep -q "^$USER:" /etc/subuid || sudo usermod --add-subuids 100000-165535 --add-subgids 100000-165535 "$USER"
          # a systemd user session is what delegates the memory and pids controllers to an unprivileged user
          sudo loginctl enable-linger "$USER" || true
          sudo systemctl start "user@$(id -u).service" || true
          export XDG_RUNTIME_DIR="/run/user/$(id -u)"
          echo "XDG_RUNTIME_DIR=$XDG_RUNTIME_DIR" >> "$GITHUB_ENV"
          echo "DBUS_SESSION_BUS_ADDRESS=unix:path=$XDG_RUNTIME_DIR/bus" >> "$GITHUB_ENV"
          podman system migrate || true
          podman pull "$OCI_TEST_IMAGE"
          podman info --format '{{json .Host.Security}} cgroups={{.Host.CgroupsVersion}} manager={{.Host.CgroupManager}}'
          cat "/sys/fs/cgroup/user.slice/user-$(id -u).slice/user@$(id -u).service/cgroup.controllers" || true
          echo "AG_OCI_RUNTIME=podman" >> "$GITHUB_ENV"
      # What this runtime writes down for the flags the sandbox passes: the evidence behind the record check
      # (crates/ag-sandbox/src/oci_record.rs), and the fixture to extend when a runtime spells something new.
      - name: What the runtime records for the sandbox's flags
        run: |
          rt="${AG_OCI_RUNTIME}"
          mkdir -p "$RUNNER_TEMP/rec" && chmod 0777 "$RUNNER_TEMP/rec"
          "$rt" rm -f ag-diag > /dev/null 2>&1 || true
          "$rt" run --name ag-diag --pull never --network none --read-only --cap-drop ALL \
            --security-opt no-new-privileges --user 65534:65534 --pids-limit 32 --memory 67108864 \
            --memory-swap 67108864 --cpus 1 --ulimit nofile=1024:1024 --ulimit cpu=60:61 --ulimit core=0:0 \
            --tmpfs /tmp:rw,nosuid,nodev,size=1048576 --mount "type=bind,src=$RUNNER_TEMP/rec,dst=/work" \
            --workdir /work --entrypoint true "$OCI_TEST_IMAGE"
          "$rt" inspect --type container ag-diag > "$RUNNER_TEMP/ag-diag.json"
          python3 - <<'PY'
          import json, os
          d = json.load(open(os.environ["RUNNER_TEMP"] + "/ag-diag.json"))[0]
          h = d.get("HostConfig", {})
          keys = ["ReadonlyRootfs", "NetworkMode", "PidsLimit", "Memory", "MemorySwap", "NanoCpus", "CapDrop", "CapAdd",
                  "SecurityOpt", "Privileged", "Devices", "PidMode", "IpcMode", "UTSMode", "UsernsMode", "Ulimits"]
          print("HOSTCONFIG", json.dumps({k: h.get(k) for k in keys}, sort_keys=True))
          print("TOP", json.dumps({k: d.get(k) for k in ["EffectiveCaps", "BoundingCaps", "Mounts"]}, sort_keys=True))
          print("STATE", json.dumps(d.get("State"), sort_keys=True), "USER", json.dumps(d.get("Config", {}).get("User")))
          PY
          "$rt" rm -f ag-diag > /dev/null
      # How this runtime reports a container whose process the kernel killed for memory: the sandbox maps that to
      # a memory-limit status from the record, so the record has to say it.
      - name: What the runtime records for a container the kernel killed for memory
        run: |
          rt="${AG_OCI_RUNTIME}"
          "$rt" rm -f ag-oom > /dev/null 2>&1 || true
          code=0
          "$rt" run --name ag-oom --pull never --memory 67108864 --memory-swap 67108864 --entrypoint sh \
            "$OCI_TEST_IMAGE" -c 'awk "BEGIN { s = \"xxxxxxxxxxxxxxxx\"; while (1) s = s s }"' || code=$?
          echo "run exited with $code"
          "$rt" inspect --type container ag-oom --format 'OOMSTATE {{json .State}}'
          "$rt" events --since 5m --until 0s --filter container=ag-oom --format '{{.Status}}' || true
          sudo dmesg 2>/dev/null | grep -i -E 'out of memory|killed process|oom' | tail -n 5 || true
          "$rt" rm -f ag-oom > /dev/null
      - name: Build the tests
        run: cargo test -p agentgit-sandbox --test oci_real -p agentgit-worker --test oci_e2e --no-run
      - name: The sandbox against the real runtime, checked from inside the container
        run: cargo test -p agentgit-sandbox --test oci_real -- --nocapture --test-threads=1
        env:
          AG_OCI_IMAGE: ${{ env.OCI_TEST_IMAGE }}
          AG_REQUIRE_COMPONENTS: ${{ matrix.component }}
          AG_SKIP_REPORT: ${{ runner.temp }}/skips.jsonl
      - name: The worker end to end with this runtime (a check that writes its tree, a missing image, stopping now)
        if: ${{ !cancelled() }}
        run: cargo test -p agentgit-worker --test oci_e2e -- --nocapture --test-threads=1
        env:
          AG_OCI_IMAGE: ${{ env.OCI_TEST_IMAGE }}
          AG_REQUIRE_COMPONENTS: ${{ matrix.component }}
          AG_SKIP_REPORT: ${{ runner.temp }}/skips.jsonl
      - name: Skipped tests
        if: ${{ !cancelled() }}
        run: python3 scripts/check_skips.py --job "oci/${{ matrix.leg }}" --report "$RUNNER_TEMP/skips.jsonl"
      - name: Containers left behind
        if: always()
        run: |
          rt="${AG_OCI_RUNTIME:-docker}"
          "$rt" ps -a --filter label=ag-sandbox=1 --format '{{.Names}} {{.Status}}' || true

  cgroup-v2:
    name: namespace sandbox on a delegated cgroup v2
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # Ubuntu 24.04 restricts unprivileged user namespaces with AppArmor (see ci.yml).
      - name: Allow unprivileged user namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      - name: Build the tests
        run: cargo test -p agentgit-sandbox --no-run
      - name: The host
        run: |
          uname -r
          stat -fc 'cgroup file system: %T' /sys/fs/cgroup
          echo "root controllers: $(cat /sys/fs/cgroup/cgroup.controllers)"
          echo "root subtree_control: $(cat /sys/fs/cgroup/cgroup.subtree_control)"
          cat /proc/self/cgroup
      # What a systemd unit with Delegate= and DelegateSubgroup= gives a service, made by hand: a cgroup owned by
      # the test user, with the memory and pids controllers enabled for its children, a leaf for the user's
      # processes (a cgroup with processes cannot enable controllers for children), and an empty `sandboxes`
      # directory under which the sandbox makes one cgroup per run.
      - name: Delegate a cgroup subtree to the test user
        run: |
          set -euo pipefail
          cg=/sys/fs/cgroup/ag-ci
          sudo mkdir -p "$cg/main" "$cg/sandboxes"
          echo "+memory +pids" | sudo tee /sys/fs/cgroup/cgroup.subtree_control > /dev/null || true
          echo "+memory +pids" | sudo tee "$cg/cgroup.subtree_control" > /dev/null
          echo "+memory +pids" | sudo tee "$cg/sandboxes/cgroup.subtree_control" > /dev/null
          sudo chown -R "$(id -u):$(id -g)" "$cg"
          echo "$cg controllers: $(cat $cg/cgroup.controllers); subtree: $(cat $cg/cgroup.subtree_control); sandboxes subtree: $(cat $cg/sandboxes/cgroup.subtree_control)"
      - name: The ag-sandbox suites, every limit enforced by the kernel
        run: |
          set -euo pipefail
          cg=/sys/fs/cgroup/ag-ci
          # move this step's shell (and so everything it starts) into the leaf; root may move any process
          sudo sh -c "echo $$ > $cg/main/cgroup.procs"
          cat /proc/self/cgroup
          cargo test -p agentgit-sandbox -- --nocapture
        env:
          AG_SANDBOX_CGROUP_BASE: /sys/fs/cgroup/ag-ci/sandboxes
          AG_REQUIRE_COMPONENTS: cgroup-v2,namespace-sandbox
          AG_SKIP_REPORT: ${{ runner.temp }}/skips.jsonl
      - name: Skipped tests
        if: ${{ !cancelled() }}
        run: python3 scripts/check_skips.py --job oci/cgroup-v2 --report "$RUNNER_TEMP/skips.jsonl"
      - name: Cgroups left behind
        if: always()
        run: ls -la /sys/fs/cgroup/ag-ci/sandboxes || true
