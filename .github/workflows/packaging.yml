name: Packaging

# Everything between "it works on my machine" and "someone else can install it", checked without publishing anything:
#
#   tooling   the release/install scripts' tests, shellcheck on install.sh, actionlint on the workflows, the
#             Homebrew formula and Scoop manifest rendered from a fixture
#   crates    `cargo publish --workspace --dry-run` (every publishable crate, packaged and built from its tarball in
#             dependency order; docs/operations/releasing.md lists them and the one `publish = false`), the
#             metadata checks, and that the copies of proto/ and migrations/ inside the crates are current
#   sdks      the TypeScript package (`npm pack`) and the Python package (`uv build`, `twine check`)
#
# Publishing is a separate, manual workflow: publish-sdks.yml.

on:
  push:
    branches: [main]
    paths:
      - "crates/**"
      - "proto/**"
      - "migrations/**"
      - "apps/web/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "sdk/**"
      - "scripts/**"
      - "packaging/**"
      - ".github/workflows/**"
  pull_request:
    paths:
      - "crates/**"
      - "proto/**"
      - "migrations/**"
      - "apps/web/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "sdk/**"
      - "scripts/**"
      - "packaging/**"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: packaging-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  ACTIONLINT_VERSION: 1.7.12

jobs:
  tooling:
    name: release and install tooling
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Tests (check_release, package_release, render_packaging, install.sh)
        run: python3 scripts/test_release_scripts.py
        env:
          AG_REQUIRE_COMPONENTS: dash
      - name: shellcheck (POSIX sh for install.sh)
        run: |
          shellcheck --version
          shellcheck -s sh scripts/install.sh
      - name: actionlint (workflows, including their shell steps)
        run: |
          curl -fsSL -o "$RUNNER_TEMP/download-actionlint.bash" "https://raw.githubusercontent.com/rhysd/actionlint/v${ACTIONLINT_VERSION}/scripts/download-actionlint.bash"
          bash "$RUNNER_TEMP/download-actionlint.bash" "$ACTIONLINT_VERSION" "$RUNNER_TEMP"
          # Our workflows only: ci.yml and web.yml belong to other owners and have their own findings.
          "$RUNNER_TEMP/actionlint" -color .github/workflows/containers.yml .github/workflows/release.yml \
            .github/workflows/packaging.yml .github/workflows/publish-sdks.yml
      - name: The Homebrew formula parses, and renders with the right hashes
        run: |
          ruby -v
          printf '%s\n' \
            "$(printf 'a%.0s' $(seq 64))  agentgit-1.2.3-aarch64-apple-darwin.tar.gz" \
            "$(printf 'b%.0s' $(seq 64))  agentgit-1.2.3-x86_64-apple-darwin.tar.gz" \
            "$(printf 'c%.0s' $(seq 64))  agentgit-1.2.3-aarch64-unknown-linux-gnu.tar.gz" \
            "$(printf 'd%.0s' $(seq 64))  agentgit-1.2.3-x86_64-unknown-linux-gnu.tar.gz" \
            "$(printf 'e%.0s' $(seq 64))  agentgit-1.2.3-x86_64-pc-windows-msvc.zip" > "$RUNNER_TEMP/SHA256SUMS"
          python3 scripts/render_packaging.py --version 1.2.3 --sums "$RUNNER_TEMP/SHA256SUMS" --out "$RUNNER_TEMP/rendered"
          ruby -c "$RUNNER_TEMP/rendered/agentgit.rb"
          python3 -m json.tool "$RUNNER_TEMP/rendered/agentgit.json" > /dev/null
          grep -c 'sha256 "' "$RUNNER_TEMP/rendered/agentgit.rb"

  crates:
    name: crates.io dry run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Metadata of every package (crates, npm, PyPI)
        # pipefail: without it `tee` hides the checker's exit status and an incomplete crate passes this step.
        run: |
          set -euo pipefail
          python3 scripts/check_publish_metadata.py --list | tee "$RUNNER_TEMP/metadata.txt"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: The Web UI goes into agentgit-ui-assets, as in a release
        run: |
          set -euo pipefail
          bash scripts/build_ui.sh
          python3 scripts/sync_crate_files.py --ui
      - name: Files that crates read from outside their directory are copied into them
        run: python3 scripts/sync_crate_files.py --check
      - name: cargo publish --dry-run for every publishable crate, in dependency order
        # `--workspace` is what makes this work before anything is on crates.io: cargo packages the members in
        # dependency order and resolves each against the tarballs of the ones before it (a single `-p` could not,
        # `agentgit-types` and the rest do not exist on the registry yet). `publish = false` members are skipped.
        # --allow-dirty: the copied Web UI (crates/ag-ui-assets/dist, git-ignored on purpose) counts as uncommitted.
        run: |
          set -euo pipefail
          echo "cargo publish --workspace --dry-run --locked --allow-dirty"
          cargo publish --workspace --dry-run --locked --allow-dirty 2>&1 | tee "$RUNNER_TEMP/publish.txt"
          # Every publishable crate must have been packaged, verified (built from its tarball) and "uploaded" (dry run).
          want=$(sed -n 's/^publish order: //p' "$RUNNER_TEMP/metadata.txt" | tr ' ' '\n' | sort)
          for stage in Packaging Verifying Uploading; do
            # CARGO_TERM_COLOR=always puts escape sequences around the stage name: strip them first.
            got=$(sed 's/\x1b\[[0-9;]*m//g' "$RUNNER_TEMP/publish.txt" | sed -n "s/^ *$stage \(agentgit-[a-z-]*\) v.*/\1/p" | sort -u)
            if [ "$got" != "$want" ]; then
              echo "::error::$stage covered a different set of crates than 'publish order'"
              diff <(echo "$want") <(echo "$got") || true
              exit 1
            fi
          done
      - name: What the crates would contain
        run: |
          set -euo pipefail
          for c in $(sed -n 's/^publish order: //p' "$RUNNER_TEMP/metadata.txt" | tr ' ' '\n'); do
            echo "== $c"; cargo package --list --locked -p "$c" --allow-dirty > "$RUNNER_TEMP/list-$c.txt"; head -30 "$RUNNER_TEMP/list-$c.txt"
          done
          grep -qx 'dist/index.html' "$RUNNER_TEMP/list-agentgit-ui-assets.txt" || { echo "::error::agentgit-ui-assets does not carry the Web UI"; exit 1; }
          grep -qx 'proto/agwp/v1/agwp.proto' "$RUNNER_TEMP/list-agentgit-protocol.txt"
          grep -qx 'migrations/sqlite/0001_init.sql' "$RUNNER_TEMP/list-agentgit-storage.txt"
          grep -qx 'migrations/control/sqlite/0001_init.sql' "$RUNNER_TEMP/list-agentgit-server.txt"

  sdks:
    name: SDK packages (npm pack, uv build, twine check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: sdk/typescript/package-lock.json
      - name: TypeScript SDK - build and npm pack
        working-directory: sdk/typescript
        run: |
          set -euo pipefail
          npm ci
          npm run build
          mkdir -p "$RUNNER_TEMP/npm"
          npm pack --pack-destination "$RUNNER_TEMP/npm"
          tar -tzf "$RUNNER_TEMP"/npm/*.tgz | sort
          npm publish --dry-run --access public
      - uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
      - name: Python SDK - build and twine check
        working-directory: sdk/python
        run: |
          set -euo pipefail
          uv build --out-dir "$RUNNER_TEMP/py"
          ls -la "$RUNNER_TEMP/py"
          uvx twine check --strict "$RUNNER_TEMP"/py/*
          unzip -l "$RUNNER_TEMP"/py/*.whl | tail -n +4 | head -30
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sdk-packages
          path: |
            ${{ runner.temp }}/npm
            ${{ runner.temp }}/py
          retention-days: 7
