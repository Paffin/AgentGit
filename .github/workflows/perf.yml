name: Performance

# Bounded performance qualification plus extended weekly/manual measurements.
on:
  workflow_call:
    inputs:
      extended:
        type: boolean
        default: false
  schedule:
    - cron: "41 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: perf-${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  smoke:
    name: smoke (correctness)
    if: ${{ !inputs.extended && github.workflow != 'Performance' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    # No latency/throughput thresholds: fail only on an unsuccessful run, including integrity violations.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          cache-workspace-crates: true
          key: perf
      - name: Build the server and the tool (release)
        run: cargo build --locked --release -p agentgit-server -p agentgit-bench
      - name: Engine benchmark (1k and 10k files)
        run: target/release/ag-bench engine --sizes 1000,10000 --samples 5 --json engine-smoke.json --markdown engine-smoke.md
      - name: Load test against a real ag-server
        run: target/release/ag-bench load --profile smoke --json load-smoke.json --markdown load-smoke.md
      - name: Results in the job summary
        if: always()
        run: |
          for f in engine-smoke.md load-smoke.md; do
            if [ -f "$f" ]; then cat "$f" >> "$GITHUB_STEP_SUMMARY"; echo >> "$GITHUB_STEP_SUMMARY"; fi
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: perf-smoke
          path: |
            engine-smoke.json
            engine-smoke.md
            load-smoke.json
            load-smoke.md
          if-no-files-found: ignore
          retention-days: 30

  full:
    name: full (weekly, by hand)
    if: inputs.extended || github.workflow == 'Performance'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          cache-workspace-crates: true
          key: perf
      - run: cargo build --locked --release -p agentgit-server -p agentgit-bench
      - name: Engine benchmark, in memory
        run: target/release/ag-bench engine --backend memory --json engine-memory.json --markdown engine-memory.md
      - name: Engine benchmark, on disk (SQLite and files)
        run: target/release/ag-bench engine --backend disk --sizes 1000,10000 --json engine-disk.json --markdown engine-disk.md
      - name: Load test
        run: target/release/ag-bench load --profile full --json load-full.json --markdown load-full.md
      - name: Results in the job summary
        if: always()
        run: |
          for f in engine-memory.md engine-disk.md load-full.md; do
            if [ -f "$f" ]; then cat "$f" >> "$GITHUB_STEP_SUMMARY"; echo >> "$GITHUB_STEP_SUMMARY"; fi
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: perf-full
          path: |
            engine-memory.json
            engine-memory.md
            engine-disk.json
            engine-disk.md
            load-full.json
            load-full.md
          if-no-files-found: ignore
          retention-days: 90
