name: Release

# Push a tag like v0.2.0 to build binaries for four platforms, a container image, checksums and
# build-provenance attestations, and to publish a GitHub release whose notes are the matching
# CHANGELOG section. Nothing here has run yet — the first tag is its first test; see
# docs/operations/releasing.md for what to check.

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  verify:
    name: tag matches the code
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: python3 scripts/check_release.py "${GITHUB_REF_NAME}" | tee -a "$GITHUB_OUTPUT"

  test:
    name: tests
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --locked

  binaries:
    name: binaries (${{ matrix.target }})
    needs: [verify, test]
    strategy:
      fail-fast: true
      matrix:
        include:
          - {target: x86_64-unknown-linux-gnu, os: ubuntu-22.04}
          - {target: aarch64-unknown-linux-gnu, os: ubuntu-22.04-arm}
          - {target: aarch64-apple-darwin, os: macos-14}
          - {target: x86_64-apple-darwin, os: macos-13}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build
        env:
          # Do not embed the build directory in the binaries.
          RUSTFLAGS: --remap-path-prefix=${{ github.workspace }}=/agentgit --remap-path-prefix=${{ runner.temp }}=/tmp
        run: cargo build --release --locked --target ${{ matrix.target }} -p ag-cli -p ag-server
      - name: Package
        id: pkg
        run: |
          set -euo pipefail
          name="agentgit-${{ needs.verify.outputs.version }}-${{ matrix.target }}"
          mkdir "$name"
          cp "target/${{ matrix.target }}/release/ag" "target/${{ matrix.target }}/release/ag-server" LICENSE NOTICE README.md "$name/"
          tar -czf "$name.tar.gz" "$name"
          echo "file=$name.tar.gz" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.pkg.outputs.file }}
          path: ${{ steps.pkg.outputs.file }}
          if-no-files-found: error

  image:
    name: container images
    needs: [verify, test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Server image
        id: server
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile
          target: server
          push: true
          provenance: mode=max
          sbom: true
          tags: |
            ghcr.io/paffin/agentgit-server:${{ needs.verify.outputs.version }}
          labels: |
            org.opencontainers.image.source=https://github.com/Paffin/AgentGit
            org.opencontainers.image.version=${{ needs.verify.outputs.version }}
            org.opencontainers.image.licenses=Apache-2.0
      - name: CLI image
        id: cli
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile
          target: cli
          push: true
          provenance: mode=max
          sbom: true
          tags: |
            ghcr.io/paffin/agentgit-cli:${{ needs.verify.outputs.version }}
          labels: |
            org.opencontainers.image.source=https://github.com/Paffin/AgentGit
            org.opencontainers.image.version=${{ needs.verify.outputs.version }}
            org.opencontainers.image.licenses=Apache-2.0
      - uses: actions/attest-build-provenance@v2
        with:
          subject-name: ghcr.io/paffin/agentgit-server
          subject-digest: ${{ steps.server.outputs.digest }}
          push-to-registry: true
      - uses: actions/attest-build-provenance@v2
        with:
          subject-name: ghcr.io/paffin/agentgit-cli
          subject-digest: ${{ steps.cli.outputs.digest }}
          push-to-registry: true

  publish:
    name: GitHub release
    needs: [verify, binaries, image]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: sha256sum agentgit-*.tar.gz | tee SHA256SUMS
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/agentgit-*.tar.gz
      - name: Release notes from the CHANGELOG
        run: python3 scripts/check_release.py "${GITHUB_REF_NAME}" --notes > notes.md
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          flags=""
          case "${GITHUB_REF_NAME}" in *-*) flags="--prerelease";; esac
          gh release create "${GITHUB_REF_NAME}" dist/* --title "AgentGit ${GITHUB_REF_NAME}" --notes-file notes.md $flags
