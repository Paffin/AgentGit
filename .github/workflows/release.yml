name: Release

# Fast promotion only. Builds and native smoke tests belong to Prepare release; full qualification is nightly.
# Execution budgets are 3 minutes for publication plus 2 for parallel public-install checks (runner queue excluded).
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Prepared version, matching this v* tag"
        required: true
        type: string
      publish:
        description: "Publish the ready candidate; false verifies it without publishing"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY_IMAGE_SERVER: ghcr.io/paffin/agentgit-server
  REGISTRY_IMAGE_CLI: ghcr.io/paffin/agentgit-cli

jobs:
  publish:
    name: Promote the prepared candidate
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: write
      actions: read
      packages: write
    outputs:
      version: ${{ steps.v.outputs.version }}
      cargo_version: ${{ steps.v.outputs.cargo_version }}
      publish: ${{ steps.mode.outputs.publish }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: mode
        name: Publish, or rehearse?
        env:
          EVENT: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_PUBLISH: ${{ inputs.publish }}
        run: |
          set -euo pipefail
          publish=false
          if [ "$EVENT" = push ] && [ "$REF_TYPE" = tag ]; then
            publish=true
            ref="$REF_NAME"
          elif [ "$EVENT" = workflow_dispatch ]; then
            ref="$INPUT_VERSION"
            if [ "$INPUT_PUBLISH" = true ]; then
              if [ "$REF_TYPE" != tag ] || [ "${REF_NAME#v}" != "${INPUT_VERSION#v}" ]; then
                echo "::error::publish=true needs the workflow to run on the tag v${INPUT_VERSION#v} (it ran on $REF_TYPE '$REF_NAME'). Nothing was published."
                exit 1
              fi
              publish=true
              # A real run validates the actual tag, even when the input omits its v.
              ref="$REF_NAME"
            fi
          else
            ref="0.0.0-rc.dry" # a push to a rehearsal branch
          fi
          echo "ref=$ref" >> "$GITHUB_ENV"
          {
            echo "publish=$publish"
            echo "commit_date=$(git show -s --format=%cs HEAD)"
            echo "epoch=$(git show -s --format=%ct HEAD)"
          } >> "$GITHUB_OUTPUT"
          echo "mode: publish=$publish ref=$ref"
      - id: v
        name: The version matches the code and the CHANGELOG
        run: |
          set -euo pipefail
          flag=""
          [ "${{ steps.mode.outputs.publish }}" = true ] || flag="--dry-run"
          python3 scripts/check_release.py "$ref" $flag | tee -a "$GITHUB_OUTPUT"
      - id: ready
        name: Find successful preparation for this exact commit
        run: python3 scripts/release_candidate.py resolve
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-dist
          path: dist
          run-id: ${{ steps.ready.outputs.run_id }}
          github-token: ${{ github.token }}
      - id: images
        name: Verify source, version, image digests and every file checksum
        env:
          VERSION: ${{ steps.v.outputs.version }}
          PREPARE_RUN_ID: ${{ steps.ready.outputs.run_id }}
        run: python3 scripts/release_candidate.py verify dist
      - name: Verify prepared build provenance
        run: |
          for file in dist/*; do
            gh attestation verify "$file" --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/prepare-release.yml" \
              --source-digest "$GITHUB_SHA" > /dev/null
          done
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        if: steps.mode.outputs.publish == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Promote immutable container manifests without rebuilding
        if: steps.mode.outputs.publish == 'true'
        env:
          VERSION: ${{ steps.v.outputs.version }}
          PRERELEASE: ${{ steps.v.outputs.prerelease }}
          SERVER_DIGEST: ${{ steps.images.outputs.server }}
          CLI_DIGEST: ${{ steps.images.outputs.cli }}
        run: |
          set -euo pipefail
          for kind in server cli; do
            if [ "$kind" = server ]; then image="$REGISTRY_IMAGE_SERVER"; digest="$SERVER_DIGEST";
            else image="$REGISTRY_IMAGE_CLI"; digest="$CLI_DIGEST"; fi
            docker buildx imagetools create -t "$image:$VERSION" "$image@$digest"
            if [ "$PRERELEASE" != true ]; then
              docker buildx imagetools create -t "$image:latest" "$image@$digest"
            fi
          done
      - name: Publish the exact prepared files
        if: steps.mode.outputs.publish == 'true'
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          set -euo pipefail
          flags=""
          case "$VERSION" in *-*) flags="--prerelease";; esac
          if gh release view "v$VERSION" > /dev/null 2>&1; then
            gh release upload "v$VERSION" dist/* --clobber
            # shellcheck disable=SC2086
            gh release edit "v$VERSION" --title "AgentGit v$VERSION" --notes-file dist/RELEASE_NOTES.md --draft=false $flags
          else
            # shellcheck disable=SC2086
            gh release create "v$VERSION" dist/* --title "AgentGit v$VERSION" --notes-file dist/RELEASE_NOTES.md $flags --verify-tag
          fi

  install:
    if: needs.publish.outputs.publish == 'true'
    name: install.sh (${{ matrix.os }})
    needs: publish
    timeout-minutes: 2
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-22.04-arm, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      VERSION: ${{ needs.publish.outputs.version }}
      CARGO_VERSION: ${{ needs.publish.outputs.cargo_version }}
      PUBLISHED: ${{ needs.publish.outputs.publish }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the version-pinned release, verifying checksum and attestation
        run: |
          set -euo pipefail
          prefix="$RUNNER_TEMP/prefix"
          # Real releases exercise the public download path on a fresh runner. Rehearsals use the same layout locally.
          base_url="https://github.com/Paffin/AgentGit/releases/download/v$VERSION"
          uname -a
          if [ "${RUNNER_OS}" = macOS ]; then sw_vers; fi
          echo "Installing AgentGit $VERSION from $base_url"
          sh scripts/install.sh --version "$VERSION" --prefix "$prefix" --base-url "$base_url" --require-attestation
          "$prefix/bin/ag" --version
          "$prefix/bin/ag-server" --version
          "$prefix/bin/ag-worker" --version
          "$prefix/bin/ag-mcp" --version
          [ "$("$prefix/bin/orchestrator" version)" = "agent-orchestrator $CARGO_VERSION" ]
          case "$("$prefix/bin/ag" --version)" in "ag $CARGO_VERSION "*) ;; *) echo "::error::unexpected version"; exit 1;; esac
      - name: The installed binaries work end to end
        run: |
          set -euo pipefail
          prefix="$RUNNER_TEMP/prefix"
          AG_BOOTSTRAP_TOKEN=$(openssl rand -hex 32)
          AG_METRICS_TOKEN=$(openssl rand -hex 32)
          export AG_BOOTSTRAP_TOKEN AG_METRICS_TOKEN
          "$prefix/bin/ag-server" serve --listen 127.0.0.1:18080 --data-dir "$RUNNER_TEMP/data" > "$RUNNER_TEMP/server.log" 2>&1 &
          server=$!
          trap 'kill $server 2>/dev/null || true' EXIT
          python3 scripts/e2e_smoke.py --url http://127.0.0.1:18080 --ag "$prefix/bin/ag" \
            --bootstrap-token "$AG_BOOTSTRAP_TOKEN" --metrics-token "$AG_METRICS_TOKEN" || { tail -50 "$RUNNER_TEMP/server.log"; exit 1; }
