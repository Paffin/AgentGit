name: Request release

# A reviewed version bump on main is the release request. Never runs PR code with a write token.
on:
  push:
    branches: [main]
    paths:
      - "Cargo.toml"
  workflow_dispatch:
    inputs:
      ready_only:
        description: "Publish a prepared candidate immediately; fail if it is not ready"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: request-release-${{ github.sha }}
  cancel-in-progress: false

jobs:
  request:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 100
    permissions:
      contents: write # create the immutable version tag after validation
      actions: write # dispatch the existing release workflow on that exact tag
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Check whether this push changed the release version
        id: intent
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: python3 scripts/release_intent.py
      - name: Prepare the pinned candidate, then publish without blocking main
        if: steps.intent.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ github.sha }}
          READY_ONLY: ${{ inputs.ready_only }}
        run: python3 scripts/request_release.py
