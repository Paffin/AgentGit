name: Security

# Dependency changes receive path-scoped audits. Qualification runs every audit and licence/SBOM check.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      full:
        type: boolean
        default: true
  workflow_call:
    inputs:
      full:
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}-${{ inputs.full && 'full' || 'fast' }}-${{ github.workflow }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  changes:
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-latest
    outputs:
      rust_deps: ${{ steps.paths.outputs.rust_deps }}
      npm_deps: ${{ steps.paths.outputs.npm_deps }}
      python_deps: ${{ steps.paths.outputs.python_deps }}
      go_deps: ${{ steps.paths.outputs.go_deps }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: paths
        env:
          GH_TOKEN: ${{ github.token }}
          CI_WORKFLOW: security.yml
        run: python3 scripts/ci_changes.py

  cargo-deny:
    needs: changes
    if: inputs.full || needs.changes.outputs.rust_deps == 'true'
    name: cargo-deny (${{ matrix.manifest }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        manifest: [Cargo.toml, fuzz/Cargo.toml]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          manifest-path: ${{ matrix.manifest }}
          command: check
          command-arguments: --hide-inclusion-graph

  npm-audit:
    needs: changes
    if: inputs.full || needs.changes.outputs.npm_deps == 'true'
    name: npm audit (${{ matrix.dir }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        dir: [apps/web, sdk/typescript]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      # `npm audit` exits non-zero for any finding; the gate below applies the severity threshold and the
      # accepted exceptions instead, so the raw JSON is only captured here. A registry outage leaves an error
      # object (or nothing) in the file, which the gate treats as a failed scan, not a clean one.
      - name: Production dependencies
        working-directory: ${{ matrix.dir }}
        run: |
          npm audit --omit=dev --json > "$RUNNER_TEMP/npm-prod.json" || true
          python3 "$GITHUB_WORKSPACE/scripts/security_exceptions.py" npm "$RUNNER_TEMP/npm-prod.json"
      - name: All dependencies (build and test tooling too)
        working-directory: ${{ matrix.dir }}
        run: |
          npm audit --json > "$RUNNER_TEMP/npm-all.json" || true
          python3 "$GITHUB_WORKSPACE/scripts/security_exceptions.py" npm "$RUNNER_TEMP/npm-all.json"

  pip-audit:
    needs: changes
    if: inputs.full || needs.changes.outputs.python_deps == 'true'
    name: pip-audit (sdk/python)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Audit the locked runtime dependencies
        working-directory: sdk/python
        run: |
          uv export --frozen --no-dev --no-emit-project --no-hashes -o "$RUNNER_TEMP/py-requirements.txt"
          uvx pip-audit==2.10.1 -r "$RUNNER_TEMP/py-requirements.txt" --no-deps --disable-pip --format json \
            -o "$RUNNER_TEMP/pip-audit.json" || true
          python3 "$GITHUB_WORKSPACE/scripts/security_exceptions.py" pip "$RUNNER_TEMP/pip-audit.json"

  govulncheck:
    needs: changes
    if: inputs.full || needs.changes.outputs.go_deps == 'true'
    name: govulncheck (services/agent-orchestrator)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The image is built with the Go of its Dockerfile (go.mod only states the minimum), and that is the standard
      # library the shipped binary contains - so that is the toolchain to scan with.
      - name: Go version of the orchestrator image
        id: go
        run: |
          v="$(sed -n 's/^FROM golang:\([0-9][0-9.]*\).*/\1/p' services/agent-orchestrator/Dockerfile | head -n1)"
          test -n "$v"
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ steps.go.outputs.version }}
          check-latest: true
          cache-dependency-path: services/agent-orchestrator/go.sum
      # govulncheck reports a vulnerability as called only when our code can reach the vulnerable function.
      - name: govulncheck
        working-directory: services/agent-orchestrator
        env:
          GOVULNCHECK_VERSION: v1.9.0
        run: |
          go version
          go install "golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION}"
          "$(go env GOPATH)/bin/govulncheck" -format json ./... > "$RUNNER_TEMP/govulncheck.json" || true
          python3 "$GITHUB_WORKSPACE/scripts/security_exceptions.py" go "$RUNNER_TEMP/govulncheck.json"

  dependency-review:
    name: dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The action needs the repository's dependency graph, which is a setting (Settings -> Advanced Security ->
      # Dependency graph) that a workflow cannot switch on. While it is off GitHub answers 404 for the graph's SBOM and
      # the action fails every pull request with "Dependency review is not supported on this repository"; that is
      # reported as a warning here instead, and the job starts judging by itself once the graph is on. Any other
      # answer runs the action, so a real failure is never hidden.
      - name: Is the dependency graph enabled?
        id: graph
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          code=$(curl -sS -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/dependency-graph/sbom" || echo 000)
          echo "dependency graph SBOM endpoint answered $code"
          if [ "$code" = 404 ]; then
            echo "::warning title=Dependency review is off::The dependency graph is not enabled for this repository, so GitHub cannot review dependency changes. Enable it under Settings -> Advanced Security."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.graph.outputs.enabled == 'true'
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          comment-summary-in-pr: never

  sbom:
    needs: [cargo-deny, npm-audit, pip-audit, govulncheck, hygiene]
    if: inputs.full
    name: SBOMs build (scripts/sbom.sh)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          cache-workspace-crates: true
      - uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        with:
          tool: cargo-cyclonedx@0.5.9
      - name: One CycloneDX SBOM per shipped binary and one for the web UI
        run: scripts/sbom.sh --version 0.0.0-ci --out "$RUNNER_TEMP/sbom"
      - name: The working tree is still clean (the tool writes next to Cargo.toml)
        run: test -z "$(git status --porcelain)"

  hygiene:
    if: inputs.full
    name: workflows, exceptions, licence file
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: pip install pyyaml
      - name: Workflows pin their actions, declare permissions, avoid risky triggers
        run: python3 scripts/check_workflows.py --strict
      - name: Accepted exceptions have not expired and match the scanner configuration
        run: python3 scripts/security_exceptions.py check
      - name: Every dependency manifest is covered by dependabot.yml
        run: python3 scripts/check_dependabot.py
      - name: Tests of the scripts above
        run: |
          python3 scripts/test_security_exceptions.py
          python3 scripts/test_check_workflows.py
          python3 scripts/test_sbom_npm.py
          python3 scripts/test_check_dependabot.py
          python3 scripts/test_codeql_summary.py
          python3 scripts/test_coverage_summary.py
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          cache-workspace-crates: true
      - uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        with:
          tool: cargo-about@0.9.2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: services/agent-orchestrator/go.mod
          cache-dependency-path: services/agent-orchestrator/go.sum
      - name: THIRD_PARTY_LICENSES.md is up to date with Cargo.lock, package-lock.json and go.sum
        run: scripts/third_party_licenses.sh --check
