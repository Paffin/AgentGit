name: Web UI

# The Web UI (apps/web) has its own checks. They run when the UI, the API description it is generated from,
# or the server it is tested against change.
on:
  push:
    branches: [main]
    paths:
      - "apps/web/**"
      - "docs/protocol/openapi.json"
      - "crates/ag-server/**"
      - "scripts/build_ui.sh"
      - "scripts/check_skips.py"
      - "scripts/test_web_e2e_workflow.py"
      - "tests/skip-allowlist.toml"
      - ".github/workflows/web.yml"
  pull_request:
    paths:
      - "apps/web/**"
      - "docs/protocol/openapi.json"
      - "crates/ag-server/**"
      - "scripts/build_ui.sh"
      - "scripts/check_skips.py"
      - "scripts/test_web_e2e_workflow.py"
      - "tests/skip-allowlist.toml"
      - ".github/workflows/web.yml"

permissions:
  contents: read

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: lint, types, unit tests, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      # Fails if src/api/schema.gen.ts differs from what `npm run gen:api` produces from
      # docs/protocol/openapi.json: the types must never drift from the protocol.
      - name: Generated API types are up to date
        run: npm run check:api
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Keep the checked production UI for the server build
        run: tar -czf "$RUNNER_TEMP/web-dist.tar.gz" dist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: web-production-ui
          path: ${{ runner.temp }}/web-dist.tar.gz
          compression-level: 0
          retention-days: 3

  server-build:
    name: build the embedded server once
    runs-on: ubuntu-24.04
    needs: checks
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: web-e2e
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: web-production-ui
          path: ${{ runner.temp }}
      - name: Restore the checked UI
        run: tar -xzf "$RUNNER_TEMP/web-dist.tar.gz" -C apps/web
      - name: Build the server (with the UI inside) and the CLI
        run: cargo build -p agentgit-server -p agentgit-cli
      - name: Archive executable binaries and their checksums
        working-directory: target/debug
        run: |
          sha256sum ag-server ag > binaries.sha256
          tar -czf "$RUNNER_TEMP/web-binaries.tar.gz" ag-server ag binaries.sha256
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: web-test-binaries
          path: ${{ runner.temp }}/web-binaries.tar.gz
          compression-level: 0
          retention-days: 3

  # Every project runs once against the same embedded build. The screenshot project has its own
  # pristine server, so it does not delay or repeat inside the Chromium, tablet and phone jobs.
  # The whole suite, against a REAL ag-server that serves the UI from its own binary (the UI is built first and
  # embedded: `scripts/build_ui.sh`, then `cargo build`), in Chromium, Firefox and WebKit, plus the layout and
  # accessibility specs at tablet and phone size (Chromium). Nothing is quarantined: a failure is a bug or a
  # documented engine difference (docs/guides/web-ui.md, "Verified where").
  e2e:
    name: end-to-end (${{ matrix.project }})
    runs-on: ubuntu-24.04
    needs: [checks, server-build]
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:47b510dd9230bf0b9bfc9b20102241e577ea7a99334ab4c3ca19f19770e9b8ea
      options: --ipc=host
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - { project: screens }
          - { project: chromium }
          - { project: firefox }
          - { project: webkit }
          - { project: tablet }
          - { project: phone }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
        working-directory: apps/web
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: web-test-binaries
          path: ${{ runner.temp }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: web-production-ui
          path: ${{ runner.temp }}
      # Version compatibility tests serve an altered copy from disk, even in embedded mode.
      - name: Restore the UI compatibility fixture and prepare Firefox
        run: |
          tar -xzf "$RUNNER_TEMP/web-dist.tar.gz" -C apps/web
          # GitHub mounts a home directory owned by the host runner; Firefox requires our UID.
          chown "$(id -u):$(id -g)" "$HOME"
      - name: Restore and verify the shared binaries
        run: |
          mkdir -p target/debug
          tar -xzf "$RUNNER_TEMP/web-binaries.tar.gz" -C target/debug
          cd target/debug
          sha256sum --check binaries.sha256
      - name: Run the end-to-end suite
        run: npx playwright test --project=${{ matrix.project }} --no-deps
        working-directory: apps/web
        env:
          AG_SERVER_BIN: ${{ github.workspace }}/target/debug/ag-server
          AG_CLI_BIN: ${{ github.workspace }}/target/debug/ag
          AG_E2E_UI: embedded
          CI: "true"
          AG_SKIP_REPORT: ${{ runner.temp }}/skips.jsonl
      # keycloak.spec.ts skips here by design (tests/skip-allowlist.toml): the identity provider job runs it.
      - name: Skipped tests
        if: ${{ !cancelled() }}
        run: python3 scripts/check_skips.py --job "web/e2e-${{ matrix.project }}" --report "$RUNNER_TEMP/skips.jsonl"
      - name: What failed
        if: failure()
        run: node scripts/summarize-failures.mjs
        working-directory: apps/web
      - name: Keep the report when something failed
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-${{ matrix.project }}
          path: |
            apps/web/playwright-report
            apps/web/test-results
          retention-days: 7

  # Redirect sign-in against a REAL identity provider: Keycloak (a pinned image, the realm in
  # apps/web/e2e/keycloak/agentgit-realm.json). Two suites use it: the browser round trip (login redirect, groups to
  # roles, silent re-authentication, token expiry once the provider's session is revoked, sign-out at the provider;
  # e2e/keycloak.spec.ts) and the server's own token validation with tokens Keycloak issued
  # (crates/ag-server/tests/oidc_keycloak.rs). The fast fake provider in e2e/support/idp.ts stays for the cases a real
  # provider will not produce on request (a wrong state, a bad nonce, a forged signature); it is a test double and
  # is documented as one.
  identity-provider:
    name: real identity provider (Keycloak)
    runs-on: ubuntu-latest
    needs: checks
    timeout-minutes: 40
    env:
      # Tag and digest: the tag says what it is, the digest makes sure that is what runs.
      PLAYWRIGHT_IMAGE: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:47b510dd9230bf0b9bfc9b20102241e577ea7a99334ab4c3ca19f19770e9b8ea
      KEYCLOAK_IMAGE: quay.io/keycloak/keycloak:26.0.7@sha256:4388e2379b7e870a447adbe7b80bd61f5fbf04e925832b19669fda4957f05a81
      AG_E2E_KEYCLOAK: http://localhost:8180
      AG_TEST_KEYCLOAK_URL: http://localhost:8180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Start Keycloak with the test realm
        run: |
          docker run -d --name keycloak -p 8180:8080 \
            -e KC_BOOTSTRAP_ADMIN_USERNAME=admin -e KC_BOOTSTRAP_ADMIN_PASSWORD=admin \
            -v "$PWD/apps/web/e2e/keycloak:/opt/keycloak/data/import:ro" \
            "$KEYCLOAK_IMAGE" start-dev --import-realm
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: web-e2e
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Build the UI (npm ci, production build, pre-compression)
        run: scripts/build_ui.sh
      - name: Build the server (with the UI inside) and the CLI
        run: cargo build -p agentgit-server -p agentgit-cli
      - name: Pull the pinned browser runtime
        run: docker pull "$PLAYWRIGHT_IMAGE"
      - name: Wait for Keycloak
        run: |
          for i in $(seq 1 90); do
            if curl -fsS "$AG_E2E_KEYCLOAK/realms/agentgit/.well-known/openid-configuration" >/dev/null 2>&1; then
              echo "Keycloak is up after ~$((i * 2))s"; exit 0
            fi
            sleep 2
          done
          docker logs keycloak | tail -80
          echo "Keycloak did not become ready" >&2
          exit 1
      - name: The server's own token validation, with tokens Keycloak issued
        run: cargo test -p agentgit-server --test oidc_keycloak -- --test-threads=1
        env:
          AG_REQUIRE_COMPONENTS: keycloak
          AG_SKIP_REPORT: ${{ runner.temp }}/skips.jsonl
      - name: The browser round trip, token expiry and sign-out with Keycloak
        # Host networking keeps both the provider and the test server's dynamic ports reachable.
        # Reuse the checked browser image instead of downloading OS packages on every runner.
        run: |
          docker run --rm --network=host --ipc=host \
            --user "$(id -u):$(id -g)" \
            --volume "$GITHUB_WORKSPACE:/work" --volume "$RUNNER_TEMP:/evidence" \
            --workdir /work/apps/web \
            --env AG_E2E_KEYCLOAK="$AG_E2E_KEYCLOAK" \
            --env AG_SERVER_BIN=/work/target/debug/ag-server --env AG_CLI_BIN=/work/target/debug/ag \
            --env AG_E2E_UI=embedded --env CI=true --env AG_REQUIRE_COMPONENTS=keycloak \
            --env AG_SKIP_REPORT=/evidence/skips.jsonl \
            "$PLAYWRIGHT_IMAGE" npx playwright test --project=chromium --no-deps keycloak.spec.ts
      # Nothing may skip here: the whole point of this job is the real identity provider.
      - name: Skipped tests
        if: ${{ !cancelled() }}
        run: python3 scripts/check_skips.py --job web/keycloak --report "$RUNNER_TEMP/skips.jsonl"
      - name: Keycloak's log
        if: failure()
        run: docker logs keycloak | tail -120
      - name: Keep the report when something failed
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-keycloak
          path: |
            apps/web/playwright-report
            apps/web/test-results
          retention-days: 7
