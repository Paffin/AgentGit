name: Web UI

# The Web UI (apps/web) has its own checks. They run when the UI, the API description it is generated from,
# or the server it is tested against change.
on:
  push:
    branches: [main]
    paths:
      - "apps/web/**"
      - "docs/protocol/openapi.json"
      - "crates/ag-server/**"
      - ".github/workflows/web.yml"
  pull_request:
    paths:
      - "apps/web/**"
      - "docs/protocol/openapi.json"
      - "crates/ag-server/**"
      - ".github/workflows/web.yml"

permissions:
  contents: read

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: lint, types, unit tests, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      # Fails if src/api/schema.gen.ts differs from what `npm run gen:api` produces from
      # docs/protocol/openapi.json: the types must never drift from the protocol.
      - name: Generated API types are up to date
        run: npm run check:api
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  e2e:
    name: end-to-end (real ag-server, Chromium)
    runs-on: ubuntu-latest
    needs: checks
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build the server
        run: cargo build -p ag-server
        working-directory: .
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Run the end-to-end suite
        run: npm run test:e2e
        env:
          AG_SERVER_BIN: ${{ github.workspace }}/target/debug/ag-server
          CI: "true"
      - name: Keep the report when something failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
          retention-days: 7
