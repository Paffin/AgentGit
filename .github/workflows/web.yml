name: Web UI

# The Web UI (apps/web) has its own checks. They run when the UI, the API description it is generated from,
# or the server it is tested against change.
on:
  push:
    branches: [main]
    paths:
      - "apps/web/**"
      - "docs/protocol/openapi.json"
      - "crates/ag-server/**"
      - "scripts/build_ui.sh"
      - ".github/workflows/web.yml"
  pull_request:
    paths:
      - "apps/web/**"
      - "docs/protocol/openapi.json"
      - "crates/ag-server/**"
      - "scripts/build_ui.sh"
      - ".github/workflows/web.yml"

permissions:
  contents: read

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: lint, types, unit tests, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      # Fails if src/api/schema.gen.ts differs from what `npm run gen:api` produces from
      # docs/protocol/openapi.json: the types must never drift from the protocol.
      - name: Generated API types are up to date
        run: npm run check:api
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  # The whole suite, against a REAL ag-server that serves the UI from its own binary (the UI is built first and
  # embedded: `scripts/build_ui.sh`, then `cargo build`), in Chromium, plus the layout and accessibility specs at
  # tablet and phone size. The `firefox` and `webkit` projects exist in playwright.config.ts and are meant to be
  # here too ({ project: firefox, browser: firefox }, { project: webkit, browser: webkit }), but have not been seen
  # green yet: see dev/handoff/web.md. Nothing is quarantined: a failure is a bug or a documented engine difference.
  e2e:
    name: end-to-end (${{ matrix.project }})
    runs-on: ubuntu-latest
    needs: checks
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - { project: chromium, browser: chromium }
          - { project: tablet, browser: chromium }
          - { project: phone, browser: chromium }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: web-e2e
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Build the UI (npm ci, production build, pre-compression)
        run: scripts/build_ui.sh
      - name: Build the server (with the UI inside) and the CLI
        run: cargo build -p ag-server -p ag-cli
      - name: Install the browser
        run: npx playwright install --with-deps ${{ matrix.browser }}
        working-directory: apps/web
      - name: Run the end-to-end suite
        run: npx playwright test --project=${{ matrix.project }}
        working-directory: apps/web
        env:
          AG_SERVER_BIN: ${{ github.workspace }}/target/debug/ag-server
          AG_CLI_BIN: ${{ github.workspace }}/target/debug/ag
          AG_E2E_UI: embedded
          CI: "true"
      - name: What failed
        if: failure()
        run: node scripts/summarize-failures.mjs
        working-directory: apps/web
      - name: Keep the report when something failed
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report-${{ matrix.project }}
          path: |
            apps/web/playwright-report
            apps/web/test-results
          retention-days: 7
