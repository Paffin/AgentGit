name: Windows

# Native Windows qualification; not scheduled by each ordinary edit.
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  windows:
    name: windows (x86_64-pc-windows-msvc)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          cache-workspace-crates: true
      - name: Show the toolchain and Git
        run: |
          rustc -Vv
          git --version
          git config --show-origin --get-all core.autocrlf
          where.exe nasm
        continue-on-error: true
      - name: Build everything that is portable
        run: cargo build --workspace --all-targets
      # The execution plane (ag-sandbox, ag-worker) is Linux-only: ag-sandbox is empty here, ag-worker is a
      # binary that refuses to run (tests/unsupported.rs proves it). Everything else runs its whole suite.
      - name: Test
        run: cargo test --workspace --no-fail-fast
        env:
          AG_SKIP_REPORT: ${{ runner.temp }}\skips.jsonl
      - name: Skipped tests
        if: ${{ !cancelled() }}
        run: python scripts/check_skips.py --job windows/windows --report "$env:RUNNER_TEMP\skips.jsonl"
      # The README demo, as PowerShell, in both shells a Windows user has: PowerShell 7 (preinstalled on the
      # runner) and the Windows PowerShell 5.1 that ships with every Windows.
      - name: README demo (PowerShell 7)
        shell: pwsh
        run: |
          $env:AG = "$PWD\target\debug\ag.exe"
          .\examples\quickstart.ps1
      - name: README demo (Windows PowerShell 5.1)
        shell: powershell
        run: |
          $env:AG = "$PWD\target\debug\ag.exe"
          .\examples\quickstart.ps1
