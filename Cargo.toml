[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "Apache-2.0"
repository = "https://github.com/Paffin/AgentGit"
homepage = "https://github.com/Paffin/AgentGit"
authors = ["The AgentGit Authors"]
keywords = ["scm", "vcs", "agents", "version-control"]
categories = ["development-tools"]
readme = "README.md"

[workspace.dependencies]
# internal crates
ag-types = { path = "crates/ag-types", version = "0.1.0" }
ag-crypto = { path = "crates/ag-crypto", version = "0.1.0" }
ag-object = { path = "crates/ag-object", version = "0.1.0" }
ag-changeset = { path = "crates/ag-changeset", version = "0.1.0" }
ag-diff = { path = "crates/ag-diff", version = "0.1.0" }
ag-tree = { path = "crates/ag-tree", version = "0.1.0" }
ag-dag = { path = "crates/ag-dag", version = "0.1.0" }
ag-merge = { path = "crates/ag-merge", version = "0.1.0" }
ag-storage = { path = "crates/ag-storage", version = "0.1.0", default-features = false }
ag-policy = { path = "crates/ag-policy", version = "0.1.0" }
ag-agent = { path = "crates/ag-agent", version = "0.1.0" }
ag-integrate = { path = "crates/ag-integrate", version = "0.1.0" }
ag-git = { path = "crates/ag-git", version = "0.1.0" }
ag-protocol = { path = "crates/ag-protocol", version = "0.1.0" }
ag-client = { path = "crates/ag-client", version = "0.1.0" }
ag-server = { path = "crates/ag-server", version = "0.1.0" }
ag-sandbox = { path = "crates/ag-sandbox", version = "0.1.0" }

# external crates
anyhow = "1"
base64 = "0.23"
clap = { version = "4", features = ["derive", "env"] }
clap_complete = "4"
clap_mangen = "0.3"
ed25519-dalek = "3"
globset = "0.4"
hex = "0.4"
libc = "0.2"
proptest = "1"
getrandom = "0.4"
rusqlite = { version = "0.40", features = ["bundled"] }
postgres = "0.19"
rustls = { version = "0.23", default-features = false, features = ["ring", "aws_lc_rs", "std", "tls12"] }
tokio-postgres-rustls = { version = "0.14", default-features = false, features = ["ring"] }
ureq = { version = "3", default-features = false, features = ["rustls", "json"] }
webpki-roots = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tempfile = "3"
thiserror = "2"
unicode-normalization = { version = "0.1", default-features = false, features = ["std"] }
prost = "0.14"
protox = "0.10"
tonic = { version = "0.14", features = ["tls-aws-lc", "tls-webpki-roots"] }
tonic-prost = "0.14"
tonic-prost-build = "0.14"
utoipa = { version = "6", features = ["preserve_order"] }
axum = { version = "0.8", features = ["http2", "macros"] }
axum-server = { version = "0.8", features = ["tls-rustls"] }
bytes = "1"
futures-util = "0.3"
http-body-util = "0.1"
jsonwebtoken = { version = "11", default-features = false, features = ["aws_lc_rs"] }
prometheus = { version = "0.14", default-features = false }
rcgen = "0.14"
serde_html_form = "0.4"
serde_urlencoded = "0.7"
subtle = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "signal", "fs", "io-util"] }
tokio-stream = "0.1"
toml = "1"
nu-ansi-term = "0.50"
tower = "0.5"
tower-http = { version = "0.7", features = ["cors", "trace", "limit", "request-id", "set-header", "fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.dev]
# Line tables are enough for backtraces and keep target/ small (full debuginfo made it tens of GB).
debug = "line-tables-only"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
