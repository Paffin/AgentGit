[package]
name = "agentgit-integrate"
description = "The AgentGit engine: repositories, safe publication and integration"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/agentgit-integrate"
keywords.workspace = true
categories.workspace = true
readme.workspace = true

[lints]
workspace = true

[lib]
name = "ag_integrate"

[features]
default = ["tls", "s3"]
# TLS for PostgreSQL connections (sslmode=require / verify-full).
tls = ["ag-storage/tls"]
# S3-compatible object storage.
s3 = ["ag-storage/s3"]

[dependencies]
ag-types.workspace = true
ag-crypto.workspace = true
ag-object.workspace = true
ag-changeset.workspace = true
ag-diff.workspace = true
ag-tree.workspace = true
ag-dag.workspace = true
ag-merge.workspace = true
ag-storage.workspace = true
ag-policy.workspace = true
ag-agent.workspace = true
globset.workspace = true
hex.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true

[dev-dependencies]
ag-testkit.workspace = true
tempfile.workspace = true
proptest.workspace = true

[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
rustix = { version = "1.1.5", features = ["fs"] }
