[package]
name = "ag-mcp"
description = "AgentGit: a Model Context Protocol server (stdio) for the remote agent workflow"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
readme.workspace = true

[lints]
workspace = true

[lib]
name = "ag_mcp"

[[bin]]
name = "ag-mcp"
path = "src/main.rs"

[dependencies]
base64.workspace = true
clap.workspace = true
getrandom.workspace = true
globset.workspace = true
serde_json.workspace = true
ureq.workspace = true

[dev-dependencies]
ag-crypto.workspace = true
ag-types.workspace = true
# The end-to-end suites run against a real in-process ag-server. Those two crates are `publish = false`, so they are
# path-only here: `cargo publish` drops a dev-dependency that has no version, whereas `.workspace = true` would carry
# the workspace version into the published manifest and crates.io would have to resolve it.
ag-server = { path = "../ag-server" }
ag-storage = { path = "../ag-storage", default-features = false }
tempfile.workspace = true
rcgen.workspace = true
tokio.workspace = true
