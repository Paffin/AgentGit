[package]
name = "ag-server"
description = "AgentGit: the network server (AGWP over gRPC and HTTP/JSON)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
readme.workspace = true
# Not publishable yet: depends on ag-storage and ag-protocol (docs/operations/releasing.md).
publish = false

[features]
default = ["ui"]
# Embeds the built Web UI (apps/web/dist, see scripts/build_ui.sh) in the binary, through the ag-ui-assets crate.
# Without a build the server still compiles and serves a page that says how to build the UI.
ui = ["dep:ag-ui-assets"]

[lints]
workspace = true

[lib]
name = "ag_server"

[[bin]]
name = "ag-server"
path = "src/main.rs"

[dependencies]
ag-types.workspace = true
ag-crypto.workspace = true
ag-object.workspace = true
ag-changeset.workspace = true
ag-tree.workspace = true
ag-dag.workspace = true
ag-diff.workspace = true
ag-storage.workspace = true
ag-policy.workspace = true
ag-agent.workspace = true
ag-integrate.workspace = true
ag-protocol.workspace = true
ag-ui-assets = { workspace = true, optional = true }
anyhow.workspace = true
axum.workspace = true
axum-server.workspace = true
base64.workspace = true
bytes.workspace = true
clap.workspace = true
futures-util.workspace = true
globset.workspace = true
hex.workspace = true
http-body-util.workspace = true
jsonwebtoken = { workspace = true }
prometheus.workspace = true
prost.workspace = true
rusqlite.workspace = true
rustls.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_urlencoded.workspace = true
sha2.workspace = true
subtle.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-stream.workspace = true
toml.workspace = true
tonic.workspace = true
tower.workspace = true
tower-http.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
ureq.workspace = true
utoipa.workspace = true
serde_html_form.workspace = true

[target.'cfg(windows)'.dependencies]
# `enable_ansi_support()`: switches a Windows console to virtual-terminal mode (safe wrapper, no `unsafe` here).
nu-ansi-term.workspace = true

[dev-dependencies]
base64.workspace = true
jsonwebtoken = { workspace = true, features = ["use_pem"] }
rcgen.workspace = true
tempfile.workspace = true
ureq.workspace = true
futures-util.workspace = true
tokio-stream.workspace = true
