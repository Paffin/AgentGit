[package]
name = "agentgit-storage"
description = "AgentGit durable storage: an immutable object store and a transactional metadata store (files or S3, SQLite or PostgreSQL)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/agentgit-storage"
keywords.workspace = true
categories.workspace = true
readme.workspace = true

[lints]
workspace = true

[lib]
name = "ag_storage"

[features]
default = ["tls", "s3"]
# TLS for PostgreSQL connections (rustls); without it only sslmode=disable works.
tls = ["dep:rustls", "dep:tokio-postgres-rustls", "dep:webpki-roots"]
# S3-compatible object store (SigV4 over a blocking rustls HTTP client).
s3 = ["dep:ureq"]

[dependencies]
ag-types.workspace = true
ag-object.workspace = true
ag-changeset.workspace = true
ag-tree.workspace = true
ag-dag.workspace = true
ag-crypto.workspace = true
hex.workspace = true
rusqlite.workspace = true
postgres.workspace = true
rustls = { workspace = true, optional = true }
tokio-postgres-rustls = { workspace = true, optional = true }
ureq = { workspace = true, optional = true }
webpki-roots = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true

[dev-dependencies]
tempfile.workspace = true
proptest.workspace = true
