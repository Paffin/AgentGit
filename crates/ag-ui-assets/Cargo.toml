[package]
name = "agentgit-ui-assets"
description = "AgentGit: the built Web UI (apps/web/dist) as a table of embedded files"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/agentgit-ui-assets"
keywords.workspace = true
categories.workspace = true
readme.workspace = true
build = "build.rs"
# `dist/` is build output that git ignores (`scripts/sync_crate_files.py --ui` copies the Web UI there for a release);
# cargo leaves ignored files out of a package unless they are listed here.
include = ["src/**/*", "build.rs", "dist/**/*"]

[lints]
workspace = true

[lib]
name = "ag_ui_assets"
