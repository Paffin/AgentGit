# AgentGit on one machine: the server, PostgreSQL (metadata) and an S3-compatible store (objects).
#
#   cp .env.example .env      # then fill in every value
#   docker compose up -d
#   docker compose --profile observability up -d     # + Prometheus, Grafana, OpenTelemetry collector
#
# The server listens on 127.0.0.1:8080 only. This stack is a starting point for a
# single host, not a high-availability deployment (see docs/operations/deployment.md).

name: agentgit

x-restart: &restart
  restart: unless-stopped

services:
  postgres:
    <<: *restart
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ag
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: agentgit
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ag -d agentgit"]
      interval: 5s
      timeout: 3s
      retries: 20

  # The S3-compatible object store. SeaweedFS (Apache-2.0) rather than MinIO: MinIO stopped publishing container
  # images, so the pinned MinIO tag this file used to name no longer exists on any registry. Any S3-compatible
  # service works if it supports path-style addressing, SigV4, ListObjectsV2 and CopyObject; SeaweedFS passes
  # AgentGit's S3 suites (crates/ag-storage/tests/s3.rs). The S3 credentials are the ones from .env.
  seaweedfs:
    <<: *restart
    image: chrislusf/seaweedfs:4.48
    # master + volume server + filer + S3 gateway in one process; 8333 is the S3 API. The root credential is
    # taken from the environment (an S3 server with no credential configured would be open to anyone).
    command:
      - server
      - -dir=/data
      - -s3
      - -s3.port=8333
      - -master.volumeSizeLimitMB=1024
      - -volume.max=0
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:?set S3_ACCESS_KEY in .env}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:?set S3_SECRET_KEY in .env}
    volumes:
      - objectdata:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8333/status"]
      interval: 5s
      timeout: 3s
      retries: 30

  # Creates the bucket once, then exits (a second run finds it and succeeds).
  create-bucket:
    image: chrislusf/seaweedfs:4.48
    depends_on:
      seaweedfs:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -c
      - |
        out=$$(echo 's3.bucket.create -name agentgit' | weed shell -master=seaweedfs:9333 2>&1)
        echo "$$out"
        case "$$out" in *"created bucket"*|*"already exists"*) exit 0;; *) exit 1;; esac
    restart: "no"

  ag-server:
    <<: *restart
    image: ${AG_IMAGE:-ghcr.io/paffin/agentgit-server}:${AG_VERSION:-latest}
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
      target: server
    depends_on:
      postgres:
        condition: service_healthy
      create-bucket:
        condition: service_completed_successfully
    environment:
      AG_BOOTSTRAP_TOKEN: ${AG_BOOTSTRAP_TOKEN:?set AG_BOOTSTRAP_TOKEN in .env (at least 32 random characters)}
      AG_METRICS_TOKEN: ${AG_METRICS_TOKEN:?set AG_METRICS_TOKEN in .env}
      AG_PG_URL: postgres://ag:${POSTGRES_PASSWORD}@postgres:5432/agentgit?sslmode=disable
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY}
      OTEL_EXPORTER_OTLP_HEADERS: ${OTEL_EXPORTER_OTLP_HEADERS:-}
    volumes:
      - agdata:/data
      - ./ag-server.toml:/etc/agentgit/ag-server.toml:ro
    ports:
      - "127.0.0.1:8080:8080"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

  # ---- observability (docker compose --profile observability up -d) -----------------

  otel-collector:
    <<: *restart
    profiles: [observability]
    image: otel/opentelemetry-collector-contrib:0.121.0
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ../observability/otel-collector.yaml:/etc/otelcol/config.yaml:ro

  prometheus:
    <<: *restart
    profiles: [observability]
    image: prom/prometheus:v3.2.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=15d
    # The metrics token reaches Prometheus as a mounted file (secrets/metrics_token),
    # not on its command line or in its environment.
    volumes:
      - ../observability/prometheus.compose.yml:/etc/prometheus/prometheus.yml:ro
      - ../observability/alerts.yml:/etc/prometheus/alerts.yml:ro
      - promdata:/prometheus
      - type: bind
        source: ./secrets/metrics_token
        target: /etc/prometheus/metrics_token
        read_only: true
        bind:
          create_host_path: false
    ports:
      - "127.0.0.1:9090:9090"

  grafana:
    <<: *restart
    profiles: [observability]
    image: grafana/grafana:11.5.2
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
    volumes:
      - ../observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafanadata:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000"

volumes:
  agdata:
  pgdata:
  objectdata:
  promdata:
  grafanadata:
