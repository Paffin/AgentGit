# ag-server configuration for Kubernetes (mounted from a ConfigMap generated by kustomize).
# Credentials come from the `agentgit` Secret as environment variables — never from this file.

[server]
listen = "0.0.0.0:8080"
data_dir = "/data"
# TLS is terminated by the Ingress / Gateway / service mesh. Inside the cluster the
# NetworkPolicy limits who can reach the port. For TLS in the pod instead, mount a
# certificate and set tls_cert / tls_key (and remove the next line).
allow_insecure_remote = true

[auth]
bootstrap_token_env = "AG_BOOTSTRAP_TOKEN"

[metrics]
enabled = true
token_env = "AG_METRICS_TOKEN"

[telemetry]
log_format = "json"
log_filter = "info"
# otlp_endpoint = "http://otel-collector.observability.svc:4318"

# Optional: PostgreSQL metadata and S3 objects per repository. Add AG_PG_URL,
# AWS_ACCESS_KEY_ID and AWS_SECRET_ACCESS_KEY to the Secret (see secret.example.yaml).
