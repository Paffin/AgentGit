apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: agentgit
resources:
  - namespace.yaml
  - serviceaccount.yaml
  - pvc.yaml
  - deployment.yaml
  - service.yaml
  - networkpolicy.yaml
configMapGenerator:
  - name: ag-server-config
    files:
      - ag-server.toml
# The Secret is deliberately not part of the kustomization (see secret.example.yaml):
# create it out of band, or with your secret manager / sealed-secrets / external-secrets.
images:
  - name: ghcr.io/paffin/agentgit-server
    newTag: latest   # pin a released version, e.g. 0.1.0
