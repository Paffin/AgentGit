# Requires the Prometheus Operator CRDs. The metrics token is read from the same Secret
# the server uses (the Secret must be readable by the Prometheus that selects this monitor).
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: ag-server
  labels:
    app.kubernetes.io/part-of: agentgit
spec:
  # Series get job="agentgit" (the Service label app.kubernetes.io/part-of), the job name of the plain Prometheus
  # configs and of alerts.yml; without jobLabel they would be job="ag-server" and AgentGitDown could never fire.
  jobLabel: app.kubernetes.io/part-of
  selector:
    matchLabels:
      app.kubernetes.io/name: ag-server
  endpoints:
    - port: http
      path: /metrics
      interval: 15s
      authorization:
        type: Bearer
        credentials:
          name: agentgit
          key: AG_METRICS_TOKEN
