# An example only — do not commit real values. Create the Secret out of band, e.g.:
#
#   kubectl -n agentgit create secret generic agentgit \
#     --from-literal=AG_BOOTSTRAP_TOKEN="$(openssl rand -hex 32)" \
#     --from-literal=AG_METRICS_TOKEN="$(openssl rand -hex 32)"
#
# Optional keys when repositories use PostgreSQL / S3 (see ag-server.toml):
#   AG_PG_URL, AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY, AWS_SESSION_TOKEN,
#   OTEL_EXPORTER_OTLP_HEADERS
apiVersion: v1
kind: Secret
metadata:
  name: agentgit
  namespace: agentgit
type: Opaque
stringData:
  AG_BOOTSTRAP_TOKEN: "<at least 32 random characters>"
  AG_METRICS_TOKEN: "<random>"
