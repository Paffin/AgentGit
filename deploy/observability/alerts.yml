# Alerting rules for AgentGit. Every metric used here is exported by ag-server;
# scripts/check_deploy.py verifies that against a running server.
groups:
  - name: agentgit
    rules:
      - alert: AgentGitDown
        expr: up{job="agentgit"} == 0
        for: 2m
        labels: {severity: critical}
        annotations:
          summary: AgentGit server is not reachable
          description: Prometheus could not scrape {{ $labels.instance }} for 2 minutes.

      - alert: AgentGitServerErrors
        expr: |
          sum(rate(agwp_requests_total{code=~"internal|unavailable|deadline_exceeded|unimplemented"}[5m]))
            / sum(rate(agwp_requests_total[5m])) > 0.05
        for: 10m
        labels: {severity: warning}
        annotations:
          summary: More than 5% of requests fail with a server-side error
          description: Look at the `code` label of agwp_requests_total and the server log (request ids).

      - alert: AgentGitSlowRequests
        expr: |
          histogram_quantile(0.99,
            sum by (le) (rate(agwp_request_duration_seconds_bucket[5m]))) > 5
        for: 10m
        labels: {severity: warning}
        annotations:
          summary: p99 request latency above 5 seconds
          description: Check storage latency (PostgreSQL, object store) and agwp_inflight_requests.

      - alert: AgentGitShedding
        expr: increase(agwp_shed_total[5m]) > 0
        for: 5m
        labels: {severity: warning}
        annotations:
          summary: The server is rejecting requests because it is saturated
          description: limits.max_concurrent_requests is exhausted; scale the node or raise the limit.

      - alert: AgentGitRateLimiting
        expr: rate(agwp_rate_limited_total[10m]) > 1
        for: 10m
        labels: {severity: info}
        annotations:
          summary: Clients are being rate limited
          description: A client (often a misbehaving agent loop) exceeds limits.requests_per_second.

      - alert: AgentGitAuthFailures
        expr: sum(rate(agwp_auth_failures_total[5m])) > 5
        for: 5m
        labels: {severity: warning}
        annotations:
          summary: Many failed authentications
          description: Expired credentials in a fleet, or someone guessing tokens. Check the `reason` label.

      - alert: AgentGitJobsBacklog
        expr: agwp_jobs_queued > 50
        for: 15m
        labels: {severity: warning}
        annotations:
          summary: Validation jobs are queueing up
          description: No (or too few) runners are claiming jobs.

      - alert: AgentGitJobsFailing
        expr: increase(agwp_job_events_total{event="failed"}[1h]) > 5
        for: 5m
        labels: {severity: warning}
        annotations:
          summary: Validation jobs keep failing permanently
          description: Workers report failures (not check failures — those are attestations). Inspect `GET /v1/repos/{owner}/{name}/jobs?state=failed`.

      - alert: AgentGitTraceExportFailing
        expr: increase(agwp_trace_export_failures_total[15m]) > 0
        for: 15m
        labels: {severity: info}
        annotations:
          summary: Traces cannot be delivered to the collector
          description: Spans are dropped (agwp_trace_spans_dropped_total); check telemetry.otlp_endpoint.
