[package]
name = "agentgit-fuzz"
version = "0.0.0"
edition = "2024"
publish = false
license = "Apache-2.0"
description = "libFuzzer targets for every AgentGit parser and decoder that touches untrusted bytes"

[package.metadata]
cargo-fuzz = true

# A workspace of its own: `cargo fuzz` needs a nightly toolchain and sanitizer flags that must not leak
# into the main workspace.
[workspace]

[features]
# Targets whose crates pull in SQLite, PostgreSQL and the gRPC stack. Off by default so the light targets build
# in a minute; CI turns it on.
heavy = ["dep:ag-agent", "dep:ag-protocol", "dep:ag-worker", "dep:ag-integrate", "dep:ag-git", "dep:prost"]

[dependencies]
libfuzzer-sys = "0.4"
arbitrary = { version = "1", features = ["derive"] }
serde_json = "1"
ag-types = { package = "agentgit-types", path = "../crates/ag-types" }
ag-crypto = { package = "agentgit-crypto", path = "../crates/ag-crypto" }
ag-object = { package = "agentgit-object", path = "../crates/ag-object" }
ag-changeset = { package = "agentgit-changeset", path = "../crates/ag-changeset" }
ag-diff = { package = "agentgit-diff", path = "../crates/ag-diff" }
ag-tree = { package = "agentgit-tree", path = "../crates/ag-tree" }
ag-merge = { package = "agentgit-merge", path = "../crates/ag-merge" }
ag-policy = { package = "agentgit-policy", path = "../crates/ag-policy" }
ag-sandbox = { package = "agentgit-sandbox", path = "../crates/ag-sandbox" }
# heavy
prost = { version = "0.14", optional = true }
ag-agent = { package = "agentgit-agent", path = "../crates/ag-agent", optional = true }
ag-protocol = { package = "agentgit-protocol", path = "../crates/ag-protocol", optional = true }
ag-worker = { package = "agentgit-worker", path = "../crates/ag-worker", optional = true }
ag-integrate = { package = "agentgit-integrate", path = "../crates/ag-integrate", default-features = false, optional = true }
ag-git = { package = "agentgit-git", path = "../crates/ag-git", optional = true }

# cargo-fuzz builds in release mode with debug assertions and overflow checks on; keep line tables so a
# crash report names the line.
[profile.release]
debug = "line-tables-only"

# --- targets (generated by fuzz/sync_targets.py) ---

